<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f97316" />
  <title>ShiftLog</title>
  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 40px; }
    
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .btn-icon { background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 0.25rem; border-radius: 6px; }

    main { max-width: 600px; margin: 1.5rem auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text); }

    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    
    input, select, textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: var(--bg); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); background: #fff; }

    .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; margin-bottom: 1rem; }
    .stat-box { background: var(--bg); padding: 0.75rem 0.5rem; border-radius: 8px; border: 1px solid var(--border); }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .log-item:last-child { border-bottom: none; }
    .log-info { display: flex; flex-direction: column; gap: 0.1rem; }
    .log-date { font-weight: 600; }
    .log-sub { color: var(--text-muted); font-size: 0.75rem; }

    /* Drawer Modal */
    .drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: flex-end; z-index: 100; }
    .drawer.active { display: flex; }
    .drawer-content { width: 100%; max-width: 320px; background: var(--surface); height: 100%; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    @media print {
      header, .card:not(#summary-card), .btn { display: none !important; }
      body { background: white; }
      .card { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ShiftLog</h1>
    <button class="btn-icon" onclick="toggleDrawer(true)" title="Settings">⚙️</button>
  </header>

  <main>
    <!-- Log Shift Card -->
    <section class="card">
      <h2>Log Work Shift</h2>
      <form id="shiftForm">
        <div class="form-group">
          <label for="shiftDate">Date</label>
          <input type="date" id="shiftDate" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="startTime">Start Time</label>
            <input type="time" id="startTime" required />
          </div>
          <div class="form-group">
            <label for="endTime">End Time</label>
            <input type="time" id="endTime" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="startOdo">Start Odometer</label>
            <input type="number" id="startOdo" step="0.1" placeholder="0" />
          </div>
          <div class="form-group">
            <label for="endOdo">End Odometer</label>
            <input type="number" id="endOdo" step="0.1" placeholder="0" />
          </div>
        </div>
        <div class="form-group">
          <label for="shiftNotes">Notes / Location</label>
          <input type="text" id="shiftNotes" placeholder="Client site, bed assembly, cabinet work..." />
        </div>
        <button type="submit" class="btn">Save Shift</button>
      </form>
    </section>

    <!-- Quick Task Logger -->
    <section class="card">
      <h2>Quick Task Logger</h2>
      <form id="taskForm">
        <div class="form-row">
          <div class="form-group">
            <label for="taskType">Task Type</label>
            <select id="taskType">
              <option value="Cabinetry">Cabinetry</option>
              <option value="Furniture Assembly">Furniture Assembly</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Travel / Delivery">Travel / Delivery</option>
              <option value="General Admin">General Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDuration">Hours Spent</label>
            <input type="number" id="taskDuration" step="0.25" placeholder="1.5" required />
          </div>
        </div>
        <button type="submit" class="btn btn-secondary">Add Quick Task</button>
      </form>
    </section>

    <!-- Weekly Summary Card -->
    <section class="card" id="summary-card">
      <h2>Weekly Summary & Earnings</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="totalHours">0.0</div>
          <div class="stat-lbl">Hours</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="totalMiles">0.0</div>
          <div class="stat-lbl">Miles</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="totalEarnings">$0.00</div>
          <div class="stat-lbl">Gross Est.</div>
        </div>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-outline" onclick="exportCSV()">Export CSV</button>
        <button class="btn btn-outline" onclick="window.print()">Print Log</button>
      </div>
    </section>

    <!-- Recent Logs -->
    <section class="card">
      <h2>Recent Shifts</h2>
      <div id="logList"></div>
    </section>
  </main>

  <!-- Settings Drawer -->
  <div class="drawer" id="settingsDrawer">
    <div class="drawer-content">
      <h2>Settings</h2>
      <div class="form-group">
        <label for="hourlyRate">Hourly Rate ($)</label>
        <input type="number" id="hourlyRate" step="0.5" value="35.00" />
      </div>
      <div class="form-group">
        <label for="mileageRate">IRS Mileage Rate ($/mi)</label>
        <input type="number" id="mileageRate" step="0.005" value="0.67" />
      </div>
      <button class="btn" onclick="saveSettings()">Save Settings</button>
      <button class="btn btn-secondary" onclick="toggleDrawer(false)">Close</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'shiftlog_records';
    const SETTINGS_KEY = 'shiftlog_settings';

    document.getElementById('shiftDate').valueAsDate = new Date();

    function getSettings() {
      return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { hourlyRate: 35.00, mileageRate: 0.67 };
    }

    function saveSettings() {
      const settings = {
        hourlyRate: parseFloat(document.getElementById('hourlyRate').value) || 0,
        mileageRate: parseFloat(document.getElementById('mileageRate').value) || 0
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      toggleDrawer(false);
      renderLogs();
    }

    function toggleDrawer(open) {
      const drawer = document.getElementById('settingsDrawer');
      drawer.classList.toggle('active', open);
      if (open) {
        const settings = getSettings();
        document.getElementById('hourlyRate').value = settings.hourlyRate;
        document.getElementById('mileageRate').value = settings.mileageRate;
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      renderLogs();
    }

    function setNextOdometer() {
      const logs = getLogs();
      if (logs.length > 0 && logs[0].endOdo) {
        document.getElementById('startOdo').value = logs[0].endOdo;
      }
    }

    document.getElementById('shiftForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('shiftDate').value;
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const startOdo = parseFloat(document.getElementById('startOdo').value) || 0;
      const endOdo = parseFloat(document.getElementById('endOdo').value) || 0;
      const notes = document.getElementById('shiftNotes').value;

      const startTimeObj = new Date(`${date}T${start}`);
      const endTimeObj = new Date(`${date}T${end}`);
      let hours = (endTimeObj - startTimeObj) / (1000 * 60 * 60);
      if (hours < 0) hours += 24;

      const miles = endOdo > startOdo ? (endOdo - startOdo) : 0;

      const newLog = {
        id: Date.now(),
        type: 'Shift',
        date,
        hours: parseFloat(hours.toFixed(2)),
        startOdo,
        endOdo,
        miles: parseFloat(miles.toFixed(1)),
        notes
      };

      const logs = getLogs();
      logs.unshift(newLog);
      saveLogs(logs);

      document.getElementById('shiftForm').reset();
      document.getElementById('shiftDate').valueAsDate = new Date();
      setNextOdometer();
    });

    document.getElementById('taskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const taskType = document.getElementById('taskType').value;
      const duration = parseFloat(document.getElementById('taskDuration').value) || 0;

      const newLog = {
        id: Date.now(),
        type: 'Task',
        date: new Date().toISOString().split('T')[0],
        hours: duration,
        miles: 0,
        notes: taskType
      };

      const logs = getLogs();
      logs.unshift(newLog);
      saveLogs(logs);

      document.getElementById('taskDuration').value = '';
    });

    function deleteLog(id) {
      const logs = getLogs().filter(log => log.id !== id);
      saveLogs(logs);
    }

    function renderLogs() {
      const logs = getLogs();
      const settings = getSettings();
      const logList = document.getElementById('logList');
      logList.innerHTML = '';

      let totalHours = 0;
      let totalMiles = 0;

      logs.forEach(log => {
        totalHours += log.hours || 0;
        totalMiles += log.miles || 0;

        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div class="log-info">
            <span class="log-date">${log.date} — ${log.notes || log.type}</span>
            <span class="log-sub">${log.hours} hrs ${log.miles ? `• ${log.miles} mi` : ''}</span>
          </div>
          <button class="btn-icon" onclick="deleteLog(${log.id})">🗑️</button>
        `;
        logList.appendChild(item);
      });

      const totalGross = (totalHours * settings.hourlyRate) + (totalMiles * settings.mileageRate);

      document.getElementById('totalHours').innerText = totalHours.toFixed(1);
      document.getElementById('totalMiles').innerText = totalMiles.toFixed(1);
      document.getElementById('totalEarnings').innerText = `$${totalGross.toFixed(2)}`;
    }

    function exportCSV() {
      const logs = getLogs();
      if (!logs.length) return alert('No logs available to export.');

      let csv = 'ID,Date,Type,Hours,Miles,Notes\n';
      logs.forEach(l => {
        csv += `${l.id},${l.date},${l.type},${l.hours},${l.miles || 0},"${l.notes || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `shiftlog_export_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }

    renderLogs();
    setNextOdometer();
  </script>
</body>
</html>
