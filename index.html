<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShiftLog - Weekly Log Summaries</title>
  <style>
    :root {
      --primary: #ea580c;
      --primary-light: #fff7ed;
      --border: #fed7aa;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      color: var(--text);
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h2 {
      color: #9a3412;
      margin-top: 0;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }

    .week-card {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .week-header {
      margin-bottom: 10px;
    }

    .week-title {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
      color: #9a3412;
    }

    .week-stats-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--primary-light);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .stat-pill.pay {
      background: #ea580c;
      color: #ffffff;
      border: none;
    }

    /* Responsive Table Styling */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .summary-table th, 
    .summary-table td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #ffedd5;
      vertical-align: top;
    }

    .summary-table th {
      background: #fff7ed;
      color: #9a3412;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .code-badge {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #475569;
      margin-top: 2px;
    }

    /* Native Accordion Toggle Styling */
    details.entry-details {
      margin-top: 6px;
    }

    details.entry-details summary {
      cursor: pointer;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.78rem;
      list-style: none;
      display: inline-block;
      background: var(--primary-light);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
    }

    details.entry-details summary::-webkit-details-marker {
      display: none;
    }

    .details-box {
      background: #fffbf7;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #334155;
      white-space: normal;
      word-break: break-word;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
    }

    .btn-clear {
      width: 100%;
      padding: 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #475569;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    @media print {
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Weekly Log Summaries</h2>

    <div class="top-actions no-print">
      <button class="btn" onclick="exportCSV()">Manual CSV Export</button>
      <button class="btn" onclick="window.print()">Print / PDF</button>
    </div>

    <!-- Hidden Hourly Rate Input (Set your rate default value here) -->
    <input type="hidden" id="hourlyRate" value="40" />

    <div id="summaryContainer"></div>

    <button class="btn-clear no-print" onclick="clearAllEntries()">Clear All Saved Entries</button>
  </div>

  <script>
    // Sample state data fallback
    let entries = JSON.parse(localStorage.getItem('shiftlog_entries')) || [
      {
        id: 1,
        date: '2026-08-15',
        job: '116 skyway drive',
        code: '1642',
        hours: 2.75,
        totalMiles: 0,
        startMiles: 0,
        endMiles: 0,
        timeIn: '09:00',
        timeOut: '11:45',
        desc: 'Put Polly on cabinet side, Poly interior of cabinet picked up cabinet hardware and cover two and a half down and center to the style. Almost an inch and a quarter applied stain to the front of the cabinet. Put poly in the bottom of the inside. Installed outlet cover',
        notes: 'Outlet outlet cover door hardware'
      }
    ];

    function getWeekKey(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Monday start
      const monday = new Date(d.setDate(diff));
      return monday.toISOString().split('T')[0];
    }

    function renderSummaries() {
      const container = document.getElementById('summaryContainer');
      container.innerHTML = '';
      const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;

      if (entries.length === 0) {
        container.innerHTML = '<p style="color: #64748b; text-align: center;">No shift entries recorded yet.</p>';
        return;
      }

      const weeks = {};
      entries.forEach(e => {
        const wKey = getWeekKey(e.date);
        if (!weeks[wKey]) weeks[wKey] = [];
        weeks[wKey].push(e);
      });

      Object.keys(weeks).reverse().forEach(wKey => {
        let wHours = 0, wMiles = 0;
        weeks[wKey].forEach(e => {
          wHours += parseFloat(e.hours || 0);
          wMiles += parseFloat(e.totalMiles || 0);
        });
        const wPay = (wHours * rate).toFixed(2);

        let html = `
          <div class="week-card">
            <div class="week-header">
              <h3 class="week-title">📅 Week of ${wKey}</h3>
              <div class="week-stats-pills">
                <span class="stat-pill">⏱️ ${wHours.toFixed(2)} hrs</span>
                <span class="stat-pill">🚚 ${wMiles.toFixed(1)} mi</span>
                <span class="stat-pill pay">💰 $${wPay}</span>
              </div>
            </div>
            <div class="table-responsive">
              <table class="summary-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Job</th>
                    <th>Hrs</th>
                    <th class="no-print">Actions</th>
                  </tr>
                </thead>
                <tbody>`;

        weeks[wKey].forEach(e => {
          const hasDetails = e.desc || e.notes || e.timeIn || e.timeOut || e.totalMiles;

          html += `<tr>
            <td style="white-space: nowrap; font-weight: 500;">${e.date}</td>
            <td>
              <strong>${e.job}</strong><br/>
              ${e.code ? `<span class="code-badge">${e.code}</span>` : ''}
              
              ${hasDetails ? `
                <details class="entry-details no-print">
                  <summary>Details ▼</summary>
                  <div class="details-box">
                    ${e.timeIn || e.timeOut ? `<div>⏰ <strong>Time:</strong> ${e.timeIn || '--'} to ${e.timeOut || '--'}</div>` : ''}
                    ${e.totalMiles ? `<div>🚚 <strong>Miles:</strong> ${e.totalMiles} mi (${e.startMiles || 0} ➔ ${e.endMiles || 0})</div>` : ''}
                    ${e.desc ? `<div style="margin-top: 4px;"><strong>Work:</strong> ${e.desc}</div>` : ''}
                    ${e.notes ? `<div style="margin-top: 4px;"><strong>Notes:</strong> <i>${e.notes}</i></div>` : ''}
                  </div>
                </details>
              ` : ''}
            </td>
            <td style="font-weight: 600;">${e.hours}</td>
            <td class="no-print" style="white-space: nowrap;">
              <button class="action-btn" onclick="openEditModal(${e.id})">✏️</button>
              <button class="action-btn" onclick="deleteEntry(${e.id})">🗑️</button>
            </td>
          </tr>`;
        });

        html += `</tbody></table></div></div>`;
        container.innerHTML += html;
      });
    }

    function deleteEntry(id) {
      if (confirm('Delete this entry?')) {
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('shiftlog_entries', JSON.stringify(entries));
        renderSummaries();
      }
    }

    function clearAllEntries() {
      if (confirm('Clear all entries? This action cannot be undone.')) {
        entries = [];
        localStorage.setItem('shiftlog_entries', JSON.stringify(entries));
        renderSummaries();
      }
    }

    function exportCSV() {
      let csv = 'Date,Job,Code,Hours,Miles,Description,Notes\n';
      entries.forEach(e => {
        csv += `"${e.date}","${e.job}","${e.code || ''}",${e.hours},${e.totalMiles || 0},"${(e.desc || '').replace(/"/g, '""')}","${(e.notes || '').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'shiftlog_export.csv');
      a.click();
    }

    function openEditModal(id) {
      alert('Edit functionality triggered for ID: ' + id);
    }

    // Initial Render
    renderSummaries();
  </script>
</body>
</html>
